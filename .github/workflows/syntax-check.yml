name: Syntax check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate module.json
        run: node -e "JSON.parse(require('node:fs').readFileSync('module.json','utf8')); console.log('module.json OK')"
      - name: Syntax-check every file in module/
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, readdirSync } from "node:fs";
          import { join } from "node:path";
          const dir = "module";
          let fail = 0;
          for (const f of readdirSync(dir)) {
              if (!f.endsWith(".js")) continue;
              let src = readFileSync(join(dir, f), "utf8");
              // strip single-line import statements and export keywords, then parse
              src = src
                  .replace(/^import[^;]*;\s*$/gm, "")
                  .replace(/^export\s+(?=(class|function|const|let|var|async))/gm, "");
              try {
                  new Function(src);
                  console.log("OK   " + f);
              } catch (e) {
                  fail++;
                  console.error("FAIL " + f + " :: " + e.message);
              }
          }
          if (fail) {
              console.error(fail + " file(s) failed to parse");
              process.exit(1);
          }
          console.log("All module files parse.");
          EOF
